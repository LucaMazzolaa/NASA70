<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N70 | NASA70</title>
    <style>
        :root { --bg: #ffffff }
        :root { --text: #000000 }
        :root { --text-30: #b2b2b2 }
        :root { --ui-font: 'NeueMontreal', sans-serif }
        :root { --ease: cubic-bezier(0.23, 1, 0.32, 1) }

        * { cursor: none !important }
        * { margin: 0 }
        * { padding: 0 }
        * { box-sizing: border-box }
        
        html { width: 100% }
        html { height: 100% }
        html { background-color: var(--bg) }
        html { font-family: var(--ui-font) }
        html { overflow: hidden }
        html { user-select: none }
        html { -webkit-font-smoothing: antialiased }
        html { color: var(--text) }
        
        body { width: 100% }
        body { height: 100% }
        body { background-color: var(--bg) }
        body { font-family: var(--ui-font) }
        body { overflow: hidden }
        body { user-select: none }
        body { -webkit-font-smoothing: antialiased }
        body { color: var(--text) }

        header { position: fixed }
        header { top: 0 }
        header { left: 0 }
        header { width: 100% }
        header { padding: 20px 20px 40px 20px }
        header { display: grid }
        header { grid-template-columns: 1fr auto 1fr }
        header { align-items: flex-start }
        header { z-index: 10000 }
        header { background: transparent }
        header { pointer-events: none }
        header { mix-blend-mode: difference }
        
        .header-left { display: flex }
        .header-left { justify-content: flex-start }
        .header-left { pointer-events: auto }
        
        .site-title { font-size: 18px }
        .site-title { font-weight: 500 }
        .site-title { color: #ffffff }
        .site-title { letter-spacing: 0.01em }
        .site-title { cursor: pointer }
        
        .logo-container { display: flex }
        .logo-container { justify-content: center }
        .logo-container { pointer-events: auto }
        .logo-container { mix-blend-mode: normal }
        
        .logo-container img { height: 45px }
        .logo-container img { width: auto }
        .logo-container img { display: block }
        
        nav { display: flex }
        nav { justify-content: flex-end }
        nav { gap: 20px }
        nav { align-items: flex-start }
        nav { pointer-events: auto }
        
        nav a { text-decoration: none }
        nav a { color: #ffffff !important }
        nav a { font-size: 18px }
        nav a { font-weight: 500 }
        nav a { letter-spacing: 0.01em }
        nav a { transition: opacity 0.3s var(--ease) }
        nav a { line-height: 1 }
        
        nav a:hover { opacity: 0.6 }
        nav a.active { opacity: 1 }

        #cursor { position: fixed }
        #cursor { top: 0 }
        #cursor { left: 0 }
        #cursor { pointer-events: none }
        #cursor { z-index: 99999 }
        #cursor { opacity: 0 }
        #cursor { mix-blend-mode: difference }
        #cursor { color: #ffffff }
        
        .cursor-dot { position: absolute }
        .cursor-dot { top: 0 }
        .cursor-dot { left: 0 }
        .cursor-dot { width: 14px }
        .cursor-dot { height: 14px }
        .cursor-dot { background-color: #ffffff }
        .cursor-dot { border-radius: 50% }
        .cursor-dot { transform: translate(-50%, -50%) }
        .cursor-dot { transition: width 0.25s var(--ease), height 0.25s var(--ease), background-color 0.3s var(--ease), opacity 0.3s var(--ease), transform 0.3s var(--ease) }
        
        #cursor.expand .cursor-dot { width: 35px }
        #cursor.expand .cursor-dot { height: 35px }

        .center-title { position: fixed }
        .center-title { top: 50% }
        .center-title { left: 50% }
        .center-title { transform: translate(-50%, -50%) }
        .center-title { text-align: center }
        .center-title { z-index: 10 }
        .center-title { pointer-events: none }
        .center-title { width: 100% }
        .center-title { mix-blend-mode: difference }
        
        .center-title h1 { font-family: var(--ui-font) }
        .center-title h1 { font-size: 8vw }
        .center-title h1 { font-weight: 500 }
        .center-title h1 { color: #ffffff }
        .center-title h1 { margin: 0 }
        .center-title h1 { line-height: 0.95 }
        .center-title h1 { letter-spacing: -0.02em }

        #viewport { position: fixed }
        #viewport { top: 0 }
        #viewport { left: 0 }
        #viewport { width: 100vw }
        #viewport { height: 100vh }
        #viewport { z-index: 1 }
        #viewport { overflow: hidden }
        #viewport { pointer-events: auto }
        
        #canvas { position: absolute }
        #canvas { top: 0 }
        #canvas { left: 0 }
        #canvas { width: 100% }
        #canvas { height: 100% }
    </style>
</head>
<body>

<div id="cursor">
    <div class="cursor-dot"></div>
</div>

<header>
    <div class="header-left">
        <span class="site-title hover-target" onclick="window.location.href='index.html'">NASA70</span>
    </div>
    <div class="logo-container">
        <img src="assets/logo.svg" alt="N70 Logo" class="hover-target" onclick="window.open('https://www.nasa.gov/', '_blank')">
    </div>
    <nav>
        <a href="index.html" class="hover-target active">Explore</a>
        <a href="projects.html" class="hover-target">Projects</a>
        <a href="about.html" class="hover-target">About</a>
    </nav>
</header>

<div class="center-title">
    <h1>NASA’s 70th<br>Anniversary</h1>
</div>

<div id="viewport">
    <div id="canvas"></div>
</div>

<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0'

    const s = String.fromCharCode(59)

    const vertexShader = `
        varying vec2 vUv ${s}
        void main() {
            vUv = uv ${s}
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0) ${s}
            
            float dist = length(mvPosition.xy) ${s}
            mvPosition.z += dist * dist * 0.015 ${s} 
            
            gl_Position = projectionMatrix * mvPosition ${s}
        }
    `

    const fragmentShader = `
        uniform sampler2D tDiffuse ${s}
        varying vec2 vUv ${s}
        void main() {
            vec4 texColor = texture2D(tDiffuse, vUv) ${s}
            gl_FragColor = vec4(texColor.rgb, 1.0) ${s}
        }
    `

    fetch('https://ixd-supsi.github.io/n70api/data.json')
        .then(res => res.json())
        .then(data => {
            let images = []
            const jsonStr = JSON.stringify(data)
            
            const regexExt = /([^"\/]+_1\.(?:jpg|jpeg|png|webp|gif))/gi
            let match = regexExt.exec(jsonStr)
            
            while (match !== null) {
                if (!images.includes(match[1])) {
                    images.push(match[1])
                }
                match = regexExt.exec(jsonStr)
            }
            
            if (images.length === 0) {
                const findIds = (obj) => {
                    if (Array.isArray(obj)) {
                        obj.forEach(findIds)
                    } else if (obj !== null && typeof obj === 'object') {
                        if (obj.id && typeof obj.id === 'string') {
                            images.push(obj.id + '_1.jpg')
                        }
                        Object.values(obj).forEach(findIds)
                    }
                }
                findIds(data)
            }

            if (images.length === 0) {
                images = ['placeholder_1.jpg']
            }
            
            initThree(images)
        })
        .catch(err => {
            console.error(err)
            initThree(['placeholder_1.jpg'])
        })

    function initThree(imageFiles) {
        const scene = new THREE.Scene()
        
        scene.fog = new THREE.FogExp2(0xffffff, 0.015)

        const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000)
        
        camera.position.z = 15

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
        renderer.setSize(window.innerWidth, window.innerHeight)
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
        
        document.getElementById('canvas').appendChild(renderer.domElement)

        const group = new THREE.Group()
        scene.add(group)

        const scale = 0.5
        const planeWidth = 16 * scale
        const planeHeight = 9 * scale
        const gap = 2

        const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight, 32, 32)

        const cols = 8
        const rowsCount = 9

        const totalWidth = cols * (planeWidth + gap)
        const totalHeight = rowsCount * (planeHeight + gap)

        const planes = []

        const textureLoader = new THREE.TextureLoader()
        textureLoader.setCrossOrigin('anonymous')
        
        const baseUrl = 'https://raw.githubusercontent.com/ixd-supsi/n70api/main/immagini/'
        
        const textures = imageFiles.map(file => {
            const tex = textureLoader.load(baseUrl + file)
            tex.generateMipmaps = false 
            tex.minFilter = THREE.LinearFilter
            tex.magFilter = THREE.LinearFilter
            return tex
        })

        let r = 0
        let meshIndex = 0
        
        while (r < rowsCount) {
            let c = 0
            while (c < cols) {
                const currentTexture = textures[meshIndex % textures.length]
                
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        tDiffuse: { value: currentTexture }
                    },
                    vertexShader: vertexShader,
                    fragmentShader: fragmentShader,
                    side: THREE.DoubleSide
                })

                const mesh = new THREE.Mesh(geometry, material)
                
                const xPos = (c * (planeWidth + gap)) - (totalWidth / 2) + ((planeWidth + gap) / 2)
                const yPos = (r * (planeHeight + gap)) - (totalHeight / 2) + ((planeHeight + gap) / 2)
                
                mesh.position.set(xPos, yPos, 0)
                
                group.add(mesh)
                planes.push(mesh)
                
                c++
                meshIndex++
            }
            r++
        }

        let scrollY = 0
        let scrollX = 0
        let targetScrollY = 0
        let targetScrollX = 0
        let isDragging = false
        let startDragX = 0
        let startDragY = 0
        let hasMoved = false

        const centerTitleEl = document.querySelector('.center-title')

        window.addEventListener('mousedown', (e) => {
            isDragging = true
            startDragX = e.clientX
            startDragY = e.clientY
        })

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return
            
            if (!hasMoved) {
                hasMoved = true
                centerTitleEl.style.zIndex = '0'
            }

            const deltaX = e.clientX - startDragX
            const deltaY = e.clientY - startDragY
            
            targetScrollX += deltaX * 0.05
            targetScrollY -= deltaY * 0.05
            
            startDragX = e.clientX
            startDragY = e.clientY
        })

        window.addEventListener('mouseup', () => { isDragging = false })
        window.addEventListener('mouseleave', () => { isDragging = false })

        window.addEventListener('wheel', (e) => {
            if (!hasMoved) {
                hasMoved = true
                centerTitleEl.style.zIndex = '0'
            }

            targetScrollX -= e.deltaX * 0.02
            targetScrollY -= e.deltaY * 0.02
        })

        const limitX = totalWidth / 2
        const limitY = totalHeight / 2

        function animate() {
            requestAnimationFrame(animate)

            scrollX += (targetScrollX - scrollX) * 0.05
            scrollY += (targetScrollY - scrollY) * 0.05

            group.position.x = scrollX
            group.position.y = scrollY

            planes.forEach(plane => {
                const globalX = plane.position.x + scrollX
                const globalY = plane.position.y + scrollY

                if (globalX > limitX) plane.position.x -= totalWidth
                if (globalX < -limitX) plane.position.x += totalWidth

                if (globalY > limitY) plane.position.y -= totalHeight
                if (globalY < -limitY) plane.position.y += totalHeight
            })

            renderer.render(scene, camera)
        }

        animate()

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight
            camera.updateProjectionMatrix()
            renderer.setSize(window.innerWidth, window.innerHeight)
        })
    }
</script>

<script>
    const cursor = document.getElementById('cursor')
    const viewport = document.getElementById('viewport')

    let isHoveringMenu = false

    window.addEventListener('mousemove', (e) => {
        if (cursor.style.opacity !== '1') cursor.style.opacity = '1'
        cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`
    })

    document.querySelectorAll('.hover-target').forEach(el => {
        el.addEventListener('mouseenter', () => {
            isHoveringMenu = true
            cursor.classList.add('expand')
        })
        el.addEventListener('mouseleave', () => {
            isHoveringMenu = false
            cursor.classList.remove('expand')
        })
    })

    window.addEventListener('dragstart', e => e.preventDefault())
</script>
</body>
</html>
