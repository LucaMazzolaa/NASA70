<!DOCTYPE html>
<html lang="it">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA 70</title>
    <link rel="icon" href="assets/imgs/logo.svg" type="image/svg+xml">
    <style>
        :root { --bg: #f9f9f9 }
        :root { --text: #000000 }

        :root { --ui-font: 'Helvetica', 'HelveticaFallback', sans-serif }
        :root { --ease: cubic-bezier(0.23, 1, 0.32, 1) }

        * { padding: 0 }
        * { box-sizing: border-box }

        html { color: var(--text) }
        
        body { width: 100% }
        body { height: 100% }
        body { background-color: var(--bg) }
        body { font-family: var(--ui-font) }
        body { overflow: hidden }
        body { user-select: none }
        body { -webkit-font-smoothing: antialiased }
        body { color: var(--text) }
        body { cursor: default }

        header { position: fixed }
        header { top: 0 }
        header { left: 0 }
        header { width: 100% }

        header { grid-template-columns: 1fr auto 1fr }
        header { align-items: center }
        header { z-index: 10000 }
        header { background: #000000 }
        header { pointer-events: auto }
        
        .header-left { display: flex }
        .header-left { justify-content: flex-start }
        .header-left { align-items: center }

        .site-title { color: #ffffff }

        .logo-container { display: flex }
        .logo-container { justify-content: center }
        
        .logo-container img { height: 45px }
        .logo-container img { width: auto }
        .logo-container img { display: block }
        .logo-container img { cursor: pointer }
        
        nav { display: flex }
        nav { justify-content: flex-end }

        nav { align-items: center }
        
        nav a { text-decoration: none }
        nav a { color: #ffffff !important }
        nav a { font-size: 16px }
        nav a { font-weight: 500 }
        nav a { letter-spacing: 0.01em }

        nav a { cursor: pointer }

        #viewport { position: fixed }
        #viewport { top: 0 }
        #viewport { left: 0 }

        #viewport { height: 100vh }
        #viewport { z-index: 1 }
        #viewport { overflow: hidden }
        
        #canvas { position: absolute }

        #canvas { height: 100% }

        .info-btn { position: fixed }

        .info-btn { height: 44px }
        .info-btn { width: 44px }
        .info-btn { padding: 0 }

        .info-btn { border: 1px solid var(--text) }
        .info-btn { display: flex }
        .info-btn { justify-content: center }
        .info-btn { align-items: center }
        .info-btn { cursor: pointer }

        .info-btn { transition: all 0.3s var(--ease) }

        .info-panel { border: 1px solid var(--text) }
        .info-panel { padding: 20px }
        .info-panel { width: max-content }
        .info-panel { z-index: 10001 }
        .info-panel { opacity: 0 }
        .info-panel { pointer-events: none }
        .info-panel { transform: translateY(10px) }
        .info-panel { transition: all 0.3s var(--ease) }

        .info-panel.visible { opacity: 1 }
        .info-panel.visible { pointer-events: auto }

        .info-panel h2 { font-size: 16px }

        .info-grid { display: grid }

        .info-icon { display: flex }
        .info-icon { align-items: center }
        .info-icon { justify-content: center }

        .info-label { font-size: 14px }

        .info-desc { font-size: 14px }

        .info-desc { color: #959595 }

        @media (max-width: 650px) {
            .info-btn { bottom: 20px }
            .info-btn { right: 20px }

            .info-panel { right: 20px }
            .info-panel { width: calc(100vw - 40px) }
            .info-grid { grid-template-columns: 20px 50px 1fr }
        }

        <span class="site-title hover-target" onclick="window.location.href='index.html'">NASA 70</span>

    <div class="logo-container">

<div id="viewport">

<button id="info-btn" class="info-btn hover-target" aria-label="Controls">?</button>

<div id="info-panel" class="info-panel">
    <h2>Navigation</h2>
    <div class="info-grid">
        
        <div class="info-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
                <path d="M5 9l-3 3 3 3"></path>
                <path d="M9 5l3-3 3 3"></path>
                <path d="M19 9l3 3-3 3"></path>
                <path d="M9 19l3 3 3-3"></path>
                <path d="M2 12h20"></path>
                <path d="M12 2v20"></path>
            </svg>
        </div>
        <span class="info-label">Drag</span>
        <span class="info-desc">Explore projects by<br>moving through space.</span>
        
        <div class="info-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
                <polygon points="4 4 10 20 13 13 20 10"></polygon>
            </svg>
        </div>
        <span class="info-label">Click</span>
        <span class="info-desc">Open a project by<br>selecting its image.</span>
        
    </div>
</div>

<script>
    const fontRoman = new FontFace('HelveticaFallback', 'url("assets/font/HelveticaLTStd-Roman.otf")', { weight: '400' })
    const fontMedium = new FontFace('HelveticaFallback', 'url("assets/font/HelveticaLTStd-Roman.otf")', { weight: '500' })
    const fontBold = new FontFace('HelveticaFallback', 'url("assets/font/HelveticaLTStd-Bold.otf")', { weight: '600' })

    fontRoman.load().then(f => document.fonts.add(f)).catch(e => console.warn("Font 400 locale assente"))
    fontMedium.load().then(f => document.fonts.add(f)).catch(e => console.warn("Font 500 locale assente"))
    fontBold.load().then(f => document.fonts.add(f)).catch(e => console.warn("Font 600 locale assente"))
    
    document.addEventListener('DOMContentLoaded', () => {
        const infoBtn = document.getElementById('info-btn')
        const infoPanel = document.getElementById('info-panel')
        
        const iconQuestion = '?'
        const iconClose = '<span class="close-icon-text">×</span>'

        infoBtn.addEventListener('click', () => {
            infoPanel.classList.toggle('visible')
            infoBtn.classList.toggle('active')
            
            if (infoPanel.classList.contains('visible')) {
                infoBtn.innerHTML = iconClose
            } else {
                infoBtn.innerHTML = iconQuestion
            }
        })

        document.addEventListener('mousedown', (e) => {
            if (!infoPanel.contains(e.target) && !infoBtn.contains(e.target)) {
                infoPanel.classList.remove('visible')
                infoBtn.classList.remove('active')
                infoBtn.innerHTML = iconQuestion
            }
        })
    })
</script>

<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0'

    const s = String.fromCharCode(59)

    const vertexShader = `
        varying vec2 vUv ${s}
        void main() {
            vUv = uv ${s}
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0) ${s}
            
            float dist = length(mvPosition.xy) ${s}
            mvPosition.z += dist * dist * 0.015 ${s} 
            
            gl_Position = projectionMatrix * mvPosition ${s}
        }
    `

    const fragmentShader = `
        uniform sampler2D tDiffuse ${s}
        uniform vec3 uPickingColor ${s}
        uniform float uIsPicking ${s}
        varying vec2 vUv ${s}
        void main() {
            if (uIsPicking > 0.5) {
                gl_FragColor = vec4(uPickingColor, 1.0) ${s}
            } else {
                vec4 texColor = texture2D(tDiffuse, vUv) ${s}
                gl_FragColor = vec4(texColor.rgb, 1.0) ${s}
            }
        }
    `

    const textVertexShader = `
        varying vec2 vUv ${s}
        void main() {
            vUv = uv ${s}
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0) ${s}
            
            float dist = length(mvPosition.xy) ${s}
            mvPosition.z += dist * dist * 0.015 ${s} 
            
            gl_Position = projectionMatrix * mvPosition ${s}
        }
    `

    const textFragmentShader = `
        uniform sampler2D tText ${s}
        uniform vec2 uRepeat ${s}
        uniform vec2 uGlobalOffset ${s}
        uniform float uPlaneOffset ${s}
        uniform vec3 uPickingColor ${s}
        uniform float uIsPicking ${s}
        varying vec2 vUv ${s}
        void main() {
            if (uIsPicking > 0.5) {
                gl_FragColor = vec4(uPickingColor, 1.0) ${s}
            } else {
                vec2 finalUv = vec2(vUv.x * uRepeat.x + uPlaneOffset + uGlobalOffset.x, vUv.y * uRepeat.y + uGlobalOffset.y) ${s}
                vec4 textColor = texture2D(tText, finalUv) ${s}
                gl_FragColor = vec4(textColor.rgb, textColor.a) ${s}
            }
        }
    `

    fetch('https://ixd-supsi.github.io/n70api/data.json')
        .then(res => res.json())
        .then(data => {
            let projects = []
            
            data.forEach(p => {
                let imgFilename = 'placeholder_1.jpg'
                
                if (p.immagine) {
                    if (Array.isArray(p.immagine)) {
                        if (p.immagine.length > 0) {
                            imgFilename = String(p.immagine[0])
                        }
                    } else if (typeof p.immagine === 'string') {
                        imgFilename = p.immagine
                    }
                }
                
                imgFilename = imgFilename.trim()
                
                const parts = imgFilename.split('/')
                imgFilename = parts[parts.length - 1]

                if (imgFilename.includes('..._')) {
                    imgFilename = 'placeholder_1.jpg'
                }

                projects.push({ 
                    file: imgFilename, 
                    url: p.url || '#'
                })
            })

            if (projects.length === 0) {
                projects = [{ file: 'placeholder_1.jpg', url: '#' }]
            }
            
            projects.sort(() => Math.random() - 0.5)
            
            initThree(projects)
        })
        .catch(err => {
            console.error('Errore nel recupero dati:', err)
            initThree([{ file: 'placeholder_1.jpg', url: '#' }])
        })

    function initThree(projectData) {
        const scene = new THREE.Scene()
        
        scene.fog = new THREE.FogExp2(0xffffff, 0.015)

        const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000)
        
        camera.position.z = 15

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
        renderer.setSize(window.innerWidth, window.innerHeight)
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
        
        document.getElementById('canvas').appendChild(renderer.domElement)

        const group = new THREE.Group()
        scene.add(group)

        const scale = 0.5
        const planeWidth = 16 * scale
        const planeHeight = 9 * scale
        const gap = 2

        const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight, 32, 32)

        const cols = 16
        const rowsCount = 11

        const totalWidth = cols * (planeWidth + gap)
        const totalHeight = rowsCount * (planeHeight + gap)

        const planes = []

        const textureLoader = new THREE.TextureLoader()
        textureLoader.setCrossOrigin('anonymous')
        
        const baseUrl = 'https://raw.githubusercontent.com/ixd-supsi/n70api/main/immagini/'
        
        const textureDataList = projectData.map(proj => {
            const tex = textureLoader.load(baseUrl + 'placeholder_1.jpg')
            tex.generateMipmaps = false 
            tex.minFilter = THREE.LinearFilter
            tex.magFilter = THREE.LinearFilter
            
            if (proj.file && !proj.file.includes('..._') && proj.file !== 'placeholder_1.jpg') {
                const name = proj.file.substring(0, proj.file.lastIndexOf('.'))
                
                const exts = ['.jpg', '.JPG', '.png', '.PNG', '.jpeg']
                const names = [name]
                
                if (name === 'perseverancerover_1') names.push('PerseveranceRover_1')
                if (name === 'otherworlds_1') names.push('OtherWorlds_1', 'Other_Worlds_1')
                if (name === 'projectmoonbound_1') names.push('ProjectMoonbound_1')
                if (name === 'nebulavision_1') names.push('NebulaVision_1')
                if (name === 'solarscale_1') names.push('SolarScale_1')
                if (name === 'moonprint_1') names.push('MoonPrint_1')
                if (name === 'eyesonearth_1') names.push('EyesOnEarth_1')
                if (name === 'neoprotocol_1') names.push('NEOProtocol_1', 'NeoProtocol_1')
                
                const tryPaths = []
                names.forEach(n => {
                    exts.forEach(e => {
                        tryPaths.push(baseUrl + n + e)
                    })
                })
                
                let attempt = 0
                const loadNext = () => {
                    if (attempt >= tryPaths.length) return
                    const currentPath = tryPaths[attempt]
                    attempt++
                    
                    const tempTex = textureLoader.load(
                        currentPath, 
                        () => {
                            tex.image = tempTex.image
                            tex.needsUpdate = true
                        }, 
                        undefined, 
                        () => {
                            loadNext()
                        }
                    )
                }
                loadNext()
            }
            
            return { tex: tex, url: proj.url }
        })

        const textStr = "NASA’S 70TH ANNIVERSARY   •   INTERACTIVE PROJECTS CELEBRATING OUR HISTORY   •   "
        const tempCanvas = document.createElement('canvas')
        const tempCtx = tempCanvas.getContext('2d')
        tempCtx.font = '40px "Helvetica", "HelveticaFallback", sans-serif'
        const textWidth = tempCtx.measureText(textStr).width

        const textCanvas = document.createElement('canvas')
        textCanvas.width = textWidth
        textCanvas.height = 128
        const ctx = textCanvas.getContext('2d')
        ctx.font = '40px "Helvetica", "HelveticaFallback", sans-serif'
        ctx.fillStyle = '#959595' 
        ctx.textAlign = 'left'
        ctx.textBaseline = 'middle'
        ctx.fillText(textStr, 0, 64)

        const textTexture = new THREE.CanvasTexture(textCanvas)
        textTexture.wrapS = THREE.RepeatWrapping
        textTexture.wrapT = THREE.RepeatWrapping
        textTexture.minFilter = THREE.LinearFilter

        const planeAspect = (planeWidth + gap) / (gap * 0.5)
        const canvasAspect = textWidth / 128
        
        const exactRepeatX = planeAspect / canvasAspect
        let totalRepeatX = Math.round(exactRepeatX * cols)
        if (totalRepeatX < 1) totalRepeatX = 1
        const repeatX = totalRepeatX / cols
        
        const textGeometry = new THREE.PlaneGeometry(planeWidth + gap, gap * 0.5, 32, 4)
        const textUniformsOffset = { value: new THREE.Vector2(0.0, 0.0) }

        let r = 0
        let meshIndex = 0
        let nextId = 1
        
        while (r < rowsCount) {
            let c = 0
            while (c < cols) {
                const currentData = textureDataList[meshIndex % textureDataList.length]
                
                const imageId = nextId++
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        tDiffuse: { value: currentData.tex },
                        uPickingColor: { value: new THREE.Color(imageId) },
                        uIsPicking: { value: 0.0 }
                    },
                    vertexShader: vertexShader,
                    fragmentShader: fragmentShader,
                    side: THREE.DoubleSide
                })

                const mesh = new THREE.Mesh(geometry, material)
                
                mesh.frustumCulled = false 
                mesh.userData.url = currentData.url
                mesh.userData.id = imageId
                
                const xPos = (c * (planeWidth + gap)) - (totalWidth / 2) + ((planeWidth + gap) / 2)
                const yPos = (r * (planeHeight + gap)) - (totalHeight / 2) + ((planeHeight + gap) / 2)
                
                mesh.position.set(xPos, yPos, 0)
                
                group.add(mesh)
                planes.push(mesh)

                const textId = nextId++
                const meshTextMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        tText: { value: textTexture },
                        uRepeat: { value: new THREE.Vector2(repeatX, 1.0) },
                        uGlobalOffset: textUniformsOffset,
                        uPlaneOffset: { value: c * repeatX },
                        uPickingColor: { value: new THREE.Color(textId) },
                        uIsPicking: { value: 0.0 }
                    },
                    vertexShader: textVertexShader,
                    fragmentShader: textFragmentShader,
                    transparent: true,
                    side: THREE.DoubleSide
                })

                const textMesh = new THREE.Mesh(textGeometry, meshTextMaterial)
                
                textMesh.frustumCulled = false 
                const textYPos = yPos - (planeHeight / 2) - (gap / 2)
                textMesh.position.set(xPos, textYPos, 0)
                
                textMesh.userData.url = '#'
                textMesh.userData.id = textId
                
                group.add(textMesh)
                planes.push(textMesh)
                
                c++
                meshIndex++
            }
            r++
        }

        const pickingTexture = new THREE.WebGLRenderTarget(1, 1)
        const pixelBuffer = new Uint8Array(4)

        function getHoveredObject(clientX, clientY) {
            planes.forEach(p => {
                if (p.material.uniforms.uIsPicking) {
                    p.material.uniforms.uIsPicking.value = 1.0
                }
            })
            
            const oldFog = scene.fog
            scene.fog = null
            
            camera.setViewOffset(window.innerWidth, window.innerHeight, clientX, clientY, 1, 1)
            
            renderer.setRenderTarget(pickingTexture)
            renderer.clear()
            renderer.render(scene, camera)
            
            camera.clearViewOffset()
            
            try {
                renderer.readRenderTargetPixels(pickingTexture, 0, 0, 1, 1, pixelBuffer)
            } catch (e) {
                pixelBuffer[0] = 0
                pixelBuffer[1] = 0
                pixelBuffer[2] = 0
            }
            
            renderer.setRenderTarget(null)
            
            scene.fog = oldFog
            
            planes.forEach(p => {
                if (p.material.uniforms.uIsPicking) {
                    p.material.uniforms.uIsPicking.value = 0.0
                }
            })
            
            const id = (pixelBuffer[0] << 16) | (pixelBuffer[1] << 8) | pixelBuffer[2]
            return planes.find(p => p.userData.id === id)
        }

        let scrollY = 2.4
        let scrollX = 0
        let targetScrollY = 2.4
        let targetScrollX = 0
        
        let isDragging = false
        let isClick = true
        let startDragX = 0
        let startDragY = 0

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('header') || e.target.closest('.info-btn') || e.target.closest('.info-panel')) return
            
            isDragging = true
            isClick = true
            startDragX = e.clientX
            startDragY = e.clientY
        })

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - startDragX
                const deltaY = e.clientY - startDragY
                
                if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
                    isClick = false
                }
                
                targetScrollX += deltaX * 0.05
                targetScrollY -= deltaY * 0.05
                
                startDragX = e.clientX
                startDragY = e.clientY
            } else {
                if (e.target.closest('header') || e.target.closest('.info-btn') || e.target.closest('.info-panel')) {
                    if (e.target.closest('.hover-target')) {
                        document.body.style.cursor = 'pointer'
                    } else {
                        document.body.style.cursor = 'default'
                    }
                } else {
                    const hoveredObj = getHoveredObject(e.clientX, e.clientY)
                    if (hoveredObj && hoveredObj.userData.url && hoveredObj.userData.url !== '#') {
                        document.body.style.cursor = 'pointer'
                    } else {
                        document.body.style.cursor = 'default'
                    }
                }
            }
        })

        window.addEventListener('mouseup', (e) => { 
            isDragging = false 
            
            if (e.target.closest('header') || e.target.closest('.info-btn') || e.target.closest('.info-panel')) return
            
            if (isClick) {
                const clickedObj = getHoveredObject(e.clientX, e.clientY)
                if (clickedObj && clickedObj.userData.url && clickedObj.userData.url !== '#') {
                    window.open(clickedObj.userData.url, '_blank')
                }
            }
        })
        
        window.addEventListener('mouseleave', () => { isDragging = false })

        window.addEventListener('wheel', (e) => {
            targetScrollX -= e.deltaX * 0.02
            targetScrollY -= e.deltaY * 0.02
        })

        window.addEventListener('keydown', (e) => {
            const keyScrollSpeed = 2.0
            if (e.key === 'ArrowUp') {
                targetScrollY -= keyScrollSpeed
            } else if (e.key === 'ArrowDown') {
                targetScrollY += keyScrollSpeed
            } else if (e.key === 'ArrowLeft') {
                targetScrollX += keyScrollSpeed
            } else if (e.key === 'ArrowRight') {
                targetScrollX -= keyScrollSpeed
            }
        })

        const limitX = totalWidth / 2
        const limitY = totalHeight / 2

        const clock = new THREE.Clock()

        function animate() {
            requestAnimationFrame(animate)

            const delta = clock.getDelta()
            
            const speed = 0.07 
            textUniformsOffset.value.x -= speed * delta
            
            if (textUniformsOffset.value.x < 0) {
                textUniformsOffset.value.x += 1.0
            }

            scrollX += (targetScrollX - scrollX) * 0.05
            scrollY += (targetScrollY - scrollY) * 0.05

            group.position.x = scrollX
            group.position.y = scrollY

            planes.forEach(plane => {
                const globalX = plane.position.x + scrollX
                const globalY = plane.position.y + scrollY

                if (globalX > limitX) plane.position.x -= totalWidth
                if (globalX < -limitX) plane.position.x += totalWidth

                if (globalY > limitY) plane.position.y -= totalHeight
                if (globalY < -limitY) plane.position.y += totalHeight
            })

            renderer.render(scene, camera)
        }

        animate()

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight
            camera.updateProjectionMatrix()
            renderer.setSize(window.innerWidth, window.innerHeight)
        })
    }
</script>

<script>
    window.addEventListener('dragstart', e => e.preventDefault())
</script>
</body>
