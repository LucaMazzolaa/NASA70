<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fish-Eye Grid</title>
    <style>
        body { margin: 0; overflow: hidden; background: #e0e0e0 }
        canvas { display: block }
    </style>
</head>
<body>

<script type="module">
import * as THREE from 'https://cdn.skypack.dev/three@0.136.0'

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000)
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(window.innerWidth, window.innerHeight)
document.body.appendChild(renderer.domElement)

// Fish-eye Vertex Shader
const vertexShader = `
    varying vec2 vUv;
    uniform float time;
    void main() {
        vUv = uv;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        
        // Distortion effect
        float dist = length(mvPosition.xy) * 0.3;
        mvPosition.xy *= (1.0 + dist * dist);
        
        gl_Position = projectionMatrix * mvPosition;
    }
`

const fragmentShader = `
    varying vec2 vUv;
    void main() {
        gl_FragColor = vec4(0.8, 0.8, 0.8, 1.0);
    }
`

const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    side: THREE.DoubleSide
})

const items = []
const gridRows = 3
const gridCols = 6

// Create grid items
for (let i = 0; i < gridRows; i++) {
    for (let j = 0; j < gridCols; j++) {
        const geometry = new THREE.PlaneGeometry(2, 1.5)
        const plane = new THREE.Mesh(geometry, material)
        plane.position.x = (j - gridCols / 2) * 2.5
        plane.position.y = (i - gridRows / 2) * 2
        scene.add(plane)
        items.push(plane)
    }
}

camera.position.z = 5

function animate() {
    requestAnimationFrame(animate)
    
    // Simple movement for infinite effect simulation
    items.forEach(item => {
        item.position.x += 0.01
        if (item.position.x > 8) item.position.x = -8
    })
    
    renderer.render(scene, camera)
}

animate()

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight
    camera.updateProjectionMatrix()
    renderer.setSize(window.innerWidth, window.innerHeight)
})
</script>
</body>
</html>
