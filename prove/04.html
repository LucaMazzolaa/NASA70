<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite WebGL Grid - White Archive</title>
    <style>
        body { margin: 0 }
        body { overflow: hidden }
        body { background-color: #ffffff }
        body { font-family: sans-serif }
        body { cursor: grab }
        body:active { cursor: grabbing }
        canvas { display: block }
    </style>
</head>
<body>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0'

        const s = String.fromCharCode(59)

        const vertexShader = `
            varying vec2 vUv ${s}
            void main() {
                vUv = uv ${s}
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0) ${s}
                
                float dist = length(mvPosition.xy) ${s}
                mvPosition.z += dist * dist * 0.015 ${s} 
                
                gl_Position = projectionMatrix * mvPosition ${s}
            }
        `

        const fragmentShader = `
            uniform sampler2D tDiffuse ${s}
            varying vec2 vUv ${s}
            void main() {
                vec4 texColor = texture2D(tDiffuse, vUv) ${s}
                gl_FragColor = vec4(texColor.rgb, 1.0) ${s}
            }
        `

        fetch('https://ixd-supsi.github.io/n70api/data.json')
            .then(res => res.json())
            .then(data => {
                let images = []
                const jsonStr = JSON.stringify(data)
                
                const regexExt = /([^"\/]+_1\.(?:jpg|jpeg|png|webp|gif))/gi
                let match = regexExt.exec(jsonStr)
                
                while (match !== null) {
                    if (!images.includes(match[1])) {
                        images.push(match[1])
                    }
                    match = regexExt.exec(jsonStr)
                }
                
                if (images.length === 0) {
                    const findIds = (obj) => {
                        if (Array.isArray(obj)) {
                            obj.forEach(findIds)
                        } else if (obj !== null && typeof obj === 'object') {
                            if (obj.id && typeof obj.id === 'string') {
                                images.push(obj.id + '_1.jpg')
                            }
                            Object.values(obj).forEach(findIds)
                        }
                    }
                    findIds(data)
                }

                if (images.length === 0) {
                    images = ['placeholder_1.jpg']
                }
                
                initThree(images)
            })
            .catch(err => {
                console.error(err)
                initThree(['placeholder_1.jpg'])
            })

        function initThree(imageFiles) {
            const scene = new THREE.Scene()
            
            scene.fog = new THREE.FogExp2(0xffffff, 0.015)

            const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000)
            
            camera.position.z = 15

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
            renderer.setSize(window.innerWidth, window.innerHeight)
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
            document.body.appendChild(renderer.domElement)

            const group = new THREE.Group()
            scene.add(group)

            const scale = 0.5
            const planeWidth = 16 * scale
            const planeHeight = 9 * scale
            const gap = 2

            const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight, 32, 32)

            const cols = 8
            const rowsCount = 9

            const totalWidth = cols * (planeWidth + gap)
            const totalHeight = rowsCount * (planeHeight + gap)

            const planes = []

            const textureLoader = new THREE.TextureLoader()
            textureLoader.setCrossOrigin('anonymous')
            
            const baseUrl = 'https://raw.githubusercontent.com/ixd-supsi/n70api/main/immagini/'
            
            const textures = imageFiles.map(file => {
                const tex = textureLoader.load(baseUrl + file)
                tex.generateMipmaps = false 
                tex.minFilter = THREE.LinearFilter
                tex.magFilter = THREE.LinearFilter
                return tex
            })

            let r = 0
            let meshIndex = 0
            
            while (r < rowsCount) {
                let c = 0
                while (c < cols) {
                    const currentTexture = textures[meshIndex % textures.length]
                    
                    const material = new THREE.ShaderMaterial({
                        uniforms: {
                            tDiffuse: { value: currentTexture }
                        },
                        vertexShader: vertexShader,
                        fragmentShader: fragmentShader,
                        side: THREE.DoubleSide
                    })

                    const mesh = new THREE.Mesh(geometry, material)
                    
                    const xPos = (c * (planeWidth + gap)) - (totalWidth / 2) + ((planeWidth + gap) / 2)
                    const yPos = (r * (planeHeight + gap)) - (totalHeight / 2) + ((planeHeight + gap) / 2)
                    
                    mesh.position.set(xPos, yPos, 0)
                    
                    group.add(mesh)
                    planes.push(mesh)
                    
                    c++
                    meshIndex++
                }
                r++
            }

            let scrollY = 0
            let scrollX = 0
            let targetScrollY = 0
            let targetScrollX = 0
            let isDragging = false
            let startDragX = 0
            let startDragY = 0

            window.addEventListener('mousedown', (e) => {
                isDragging = true
                startDragX = e.clientX
                startDragY = e.clientY
            })

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return
                const deltaX = e.clientX - startDragX
                const deltaY = e.clientY - startDragY
                
                targetScrollX += deltaX * 0.05
                targetScrollY -= deltaY * 0.05
                
                startDragX = e.clientX
                startDragY = e.clientY
            })

            window.addEventListener('mouseup', () => { isDragging = false })
            window.addEventListener('mouseleave', () => { isDragging = false })

            window.addEventListener('wheel', (e) => {
                targetScrollX -= e.deltaX * 0.02
                targetScrollY -= e.deltaY * 0.02
            })

            const limitX = totalWidth / 2
            const limitY = totalHeight / 2

            function animate() {
                requestAnimationFrame(animate)

                scrollX += (targetScrollX - scrollX) * 0.05
                scrollY += (targetScrollY - scrollY) * 0.05

                group.position.x = scrollX
                group.position.y = scrollY

                planes.forEach(plane => {
                    const globalX = plane.position.x + scrollX
                    const globalY = plane.position.y + scrollY

                    if (globalX > limitX) plane.position.x -= totalWidth
                    if (globalX < -limitX) plane.position.x += totalWidth

                    if (globalY > limitY) plane.position.y -= totalHeight
                    if (globalY < -limitY) plane.position.y += totalHeight
                })

                renderer.render(scene, camera)
            }

            animate()

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight
                camera.updateProjectionMatrix()
                renderer.setSize(window.innerWidth, window.innerHeight)
            })
        }
    </script>
</body>
</html>
