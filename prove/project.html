<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marvell Tile & Stone | Perth's Tiling and Natural Stone Artisans</title>
<style>
  @font-face {
    font-family: 'Geist';
    font-style: normal;
    font-weight: 400;
    src: url(https://www.marvellco.com.au/_next/static/media/8d697b304b401681-s.woff2) format('woff2');
  }

  :root {
    --bg-color: #19170e;
    --text-main: #ffffff;
    --brand-color: #9b926a;
    --nav-height: 80px;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden; /* Nasconde le scrollbar */
    overscroll-behavior: none;
  }

  /* Nascondi il cursore di default per usare quello custom */
  @media (pointer: fine) {
    body { cursor: none; }
    a { cursor: none; }
  }

  /* --- Cursore Custom --- */
  .custom-cursor {
    position: fixed;
    top: 0; left: 0;
    width: 12px; height: 12px;
    background-color: var(--text-main);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    mix-blend-mode: difference;
    transform: translate3d(-50%, -50%, 0);
    transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                height 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                background-color 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 500;
    color: #19170e;
    text-transform: uppercase;
    opacity: 0; /* Appare quando il mouse si muove */
  }

  .custom-cursor.hover-project {
    width: 70px;
    height: 70px;
    background-color: var(--text-main);
    mix-blend-mode: normal;
  }
  
  .custom-cursor.hover-project::after {
    content: "View";
  }

  .custom-cursor.hover-nav {
    width: 40px;
    height: 40px;
    background-color: transparent;
    border: 1px solid var(--text-main);
  }

  /* --- Navigazione --- */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--nav-height);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    z-index: 1000;
    mix-blend-mode: difference;
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: 40px;
    margin: 0; padding: 0;
  }

  nav a {
    color: var(--text-main);
    text-decoration: none;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: color 0.3s;
  }

  nav a:hover {
    color: var(--brand-color);
  }

  .logo svg {
    width: 20px;
    height: auto;
    fill: currentColor;
  }

  /* --- Canvas Drag Animato --- */
  .canvas-container {
    position: absolute;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  .canvas-bounds {
    position: absolute;
    width: 4000px;
    height: 2500px;
    top: 0;
    left: 0;
    transform-origin: center center;
    will-change: transform;
    /* Animazione di ingresso come in page-507f...js */
    animation: introAnimation 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes introAnimation {
    0% { opacity: 0; transform: scale(1.15) translate3d(0, 0, 0); visibility: hidden; }
    100% { opacity: 1; transform: scale(1) translate3d(0, 0, 0); visibility: visible; }
  }

  /* Testo Centrale */
  .hero-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  .hero-text h1 {
    font-size: clamp(4rem, 10vw, 12rem);
    font-weight: 400;
    line-height: 0.9;
    margin: 0;
    color: var(--text-main);
    white-space: nowrap;
    letter-spacing: -0.02em;
    mix-blend-mode: difference;
  }

  .hero-text span {
    display: block;
  }

  /* --- Project Cards (Stile Next.js / Framer Motion) --- */
  .project-card {
    position: absolute;
    display: block;
    text-decoration: none;
    overflow: hidden;
    /* Rimuove lo sfarfallio sui bordi durante il resize/transform */
    backface-visibility: hidden;
    transform: translateZ(0); 
  }

  .project-card-inner {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }

  .project-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
    pointer-events: none; /* Previene il drag nativo delle immagini */
  }

  /* Animazione Hover sulla Card */
  .project-card:hover img {
    transform: scale(1.08);
  }

  /* Posizionamento Immagini nel Canvas */
  .c1 { top: 20%; left: 10%; width: 450px; height: 600px; }
  .c2 { top: 60%; left: 25%; width: 500px; height: 350px; }
  .c3 { top: 10%; left: 40%; width: 350px; height: 500px; }
  .c4 { top: 65%; left: 50%; width: 600px; height: 400px; }
  .c5 { top: 15%; left: 65%; width: 550px; height: 380px; }
  .c6 { top: 45%; left: 80%; width: 380px; height: 550px; }
  .c7 { top: 75%; left: 5%; width: 320px; height: 480px; }
  .c8 { top: 5%; left: 85%; width: 400px; height: 280px; }
  .c9 { top: 85%; left: 75%; width: 450px; height: 300px; }

</style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="custom-cursor" id="custom-cursor"></div>

  <!-- Navigazione -->
  <nav>
    <a href="#" class="logo nav-link">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 14">
        <path fill="currentColor" d="M14.25 0h-.5v14h.5zM16 0h-.5v14h.5zM.5 0H0v14h.5zM2.25 0h-.5v14h.5zM8 7l.222.389L12 1v2L8.889 8.556zL4 0h-.5v14H4V7l4 7 .25-.389L4 6V4l4.889 8.445.222-.389L4 3V1l5.778 9.89L12 7v7h.5V0H12zm4-1-2.222 4-.667-1.056L12 4z"></path>
      </svg>
    </a>
    <ul>
      <li><a href="#" class="nav-link">Projects</a></li>
      <li><a href="#" class="nav-link">Profile</a></li>
      <li><a href="#" class="nav-link">Contact</a></li>
    </ul>
  </nav>

  <!-- Area trascinabile -->
  <div class="canvas-container" id="canvas-container">
    <div class="canvas-bounds" id="canvas-bounds">
      
      <div class="hero-text">
        <h1>
          <span>Marvell</span>
          <span>Tile &amp; Stone</span>
        </h1>
      </div>

      <!-- Projects -->
      <a href="#" class="project-card c1">
        <div class="project-card-inner">
          <img src="https://ik.imagekit.io/isclzlt7q/marvell-production/images/Ainslie-hero-1_Y69UuUFHo.jpg?tr=w-450,h-675" alt="Ainslie Street">
        </div>
      </a>

      <a href="#" class="project-card c2">
        <div class="project-card-inner">
          <img src="https://ik.imagekit.io/isclzlt7q/marvell-production/images/project-hero-image-4x3-1_YbVT424zo.jpg?tr=w-500,h-350" alt="Duncraig Road">
        </div>
      </a>

      <a href="#" class="project-card c3">
        <div class="project-card-inner">
          <img src="https://ik.imagekit.io/isclzlt7q/marvell-production/images/beach-hero4_MiAGe9PlP.jpg?tr=w-350,h-500" alt="Beach Street">
        </div>
      </a>

      <a href="#" class="project-card c4">
        <div class="project-card-inner">
          <img src="https://ik.imagekit.io/isclzlt7q/marvell-production/images/170-FORRESTST-TALO-SPACEAGENCY-14JAN2025_FS_rd4PCWOtv.JPG?tr=w-600,h-400" alt="Forrest Street">
        </div>
      </a>

      <a href="#" class="project-card c5">
        <div class="project-card-inner">
          <img src="https://ik.imagekit.io/isclzlt7q/marvell-production/images/DSC_3568-cropped_YHAqn7tTJ.jpg?tr=w-550,h-380" alt="Sewell Street">
        </div>
      </a>

      <a href="#" class="project-card c6">
        <div class="project-card-inner">
          <img src="https://ik.imagekit.io/isclzlt7q/marvell-production/images/eco-hero2_Oah9Z7tSg.jpg?tr=w-380,h-550" alt="Eco Outdoor">
        </div>
      </a>

      <a href="#" class="project-card c7">
        <div class="project-card-inner">
          <img src="https://ik.imagekit.io/isclzlt7q/marvell-production/images/Vivaldi_LRs19_E5UYzx7xM.jpg?tr=w-320,h-480" alt="Vivaldi Avenue">
        </div>
      </a>

      <a href="#" class="project-card c8">
        <div class="project-card-inner">
          <img src="https://ik.imagekit.io/isclzlt7q/marvell-production/images/DSC_8864_J5POGg-uW.jpeg?tr=w-400,h-280" alt="St. Leonards Ave">
        </div>
      </a>

      <a href="#" class="project-card c9">
        <div class="project-card-inner">
          <img src="https://ik.imagekit.io/isclzlt7q/marvell-production/images/176-TALOCONSTRUCTION-74EXCELSIORST-SHENTONPARK-11APR2025_hero_YFLzGUuLj.jpg?tr=w-450,h-300" alt="Excelsior Street">
        </div>
      </a>

    </div>
  </div>

  <script>
    // --- 1. Fisica del trascinamento (Inertia Dragging) ---
    const bounds = document.getElementById('canvas-bounds');
    const container = document.getElementById('canvas-container');
    
    // Dimensioni canvas
    const canvasWidth = 4000;
    const canvasHeight = 2500;

    // Posizioni per il Lerp (Linear Interpolation)
    // Partiamo dal centro esatto
    let currentX = -(canvasWidth / 2) + (window.innerWidth / 2);
    let currentY = -(canvasHeight / 2) + (window.innerHeight / 2);
    let targetX = currentX;
    let targetY = currentY;

    // Variabili per il drag
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialTargetX = 0, initialTargetY = 0;

    // Funzione di interpolazione lineare (Inertia)
    const lerp = (start, end, factor) => {
      return start + (end - start) * factor;
    };

    // Clamp per evitare di uscire dai bordi del canvas
    const clamp = (val, min, max) => {
      return Math.min(Math.max(val, min), max);
    };

    const limitBounds = () => {
      const minX = window.innerWidth - canvasWidth;
      const minY = window.innerHeight - canvasHeight;
      targetX = clamp(targetX, minX, 0);
      targetY = clamp(targetY, minY, 0);
    };

    // --- Mouse Events ---
    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      initialTargetX = targetX;
      initialTargetY = targetY;
      container.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      
      // Moltiplicatore di sensibilità del drag
      targetX = initialTargetX + dx * 1.5; 
      targetY = initialTargetY + dy * 1.5;
      limitBounds();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      container.style.cursor = 'none';
    });

    window.addEventListener('mouseleave', () => {
      isDragging = false;
    });

    // --- Touch Events (Mobile) ---
    window.addEventListener('touchstart', (e) => {
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      initialTargetX = targetX;
      initialTargetY = targetY;
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      targetX = initialTargetX + dx * 1.5;
      targetY = initialTargetY + dy * 1.5;
      limitBounds();
    }, { passive: false });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });

    // --- Rotellina Mouse (Scroll = Drag) come nel sito originale ---
    window.addEventListener('wheel', (e) => {
      targetX -= e.deltaX * 1.5;
      targetY -= e.deltaY * 1.5;
      limitBounds();
    }, { passive: false });

    // Loop di Render ad alte prestazioni (RAF)
    const render = () => {
      // Lerp avvicina la posizione attuale al target gradualmente (effetto inerzia "Framer Motion")
      currentX = lerp(currentX, targetX, 0.08);
      currentY = lerp(currentY, targetY, 0.08);

      // Applica la trasformazione CSS3D (gpu accelerated)
      // Arrotonda a 2 decimali per evitare artefatti sub-pixel
      bounds.style.transform = `translate3d(${currentX.toFixed(2)}px, ${currentY.toFixed(2)}px, 0)`;

      requestAnimationFrame(render);
    };
    
    // Disabilita drag di default delle immagini
    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('dragstart', (e) => e.preventDefault());
    });

    // Ritarda l'avvio del loop per aspettare l'animazione di ingresso CSS
    setTimeout(() => {
      render();
    }, 1800); // 1.8s durata dell'intro
    
    // Eseguiamo un primo settaggio statico prima del loop
    bounds.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;


    // --- 2. Cursore Custom (Framer Motion replica) ---
    const cursor = document.getElementById('custom-cursor');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (cursor.style.opacity === '0' || cursor.style.opacity === '') {
        cursor.style.opacity = '1';
      }
    });

    // Loop per il ritardo "smooth" del cursore (segue il mouse dolcemente)
    const renderCursor = () => {
      cursorX = lerp(cursorX, mouseX, 0.2);
      cursorY = lerp(cursorY, mouseY, 0.2);
      cursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
      requestAnimationFrame(renderCursor);
    };
    renderCursor();

    // Gestione degli stati del cursore (Hover su progetti e navigazione)
    const projects = document.querySelectorAll('.project-card');
    const navLinks = document.querySelectorAll('.nav-link');

    projects.forEach(project => {
      project.addEventListener('mouseenter', () => {
        cursor.classList.add('hover-project');
      });
      project.addEventListener('mouseleave', () => {
        cursor.classList.remove('hover-project');
      });
    });

    navLinks.forEach(link => {
      link.addEventListener('mouseenter', () => {
        cursor.classList.add('hover-nav');
      });
      link.addEventListener('mouseleave', () => {
        cursor.classList.remove('hover-nav');
      });
    });

    // Update limiti on resize
    window.addEventListener('resize', () => {
      limitBounds();
    });

  </script>
</body>
</html>
