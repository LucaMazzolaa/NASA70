fontRoman.load().then(f => document.fonts.add(f)).catch(e => console.warn("Font 400 locale assente"))
fontMedium.load().then(f => document.fonts.add(f)).catch(e => console.warn("Font 500 locale assente"))

const pageDisplay = document.getElementById('page-display')
const currentPageNum = document.getElementById('current-page-num')
const totalPagesDisplay = document.getElementById('total-pages-display')
const paginationControls = document.getElementById('pagination-controls')
const backToTopBtn = document.getElementById('back-to-top')
let allProjectsData = []
let currentProjectsData = []
let currentSortKey = 'views'
let currentSortDir = 0
let activeTags = new Set()
let searchQuery = ""

window.handleImgError = function(img) {
const container = img.parentElement
if (container) {
container.innerHTML = `<div class="img-placeholder"><svg viewBox="0 0 160 90" preserveAspectRatio="none"><line x1="0" y1="0" x2="160" y2="90" stroke="#000000" stroke-width="1.5"/><line x1="160" y1="0" x2="0" y2="90" stroke="#000000" stroke-width="1.5"/></svg></div>`
}
}

searchInput.addEventListener('input', (e) => {
searchQuery = e.target.value.toLowerCase().trim()
if (e.target.value.length > 0) {
clearSearchBtn.classList.add('visible')
} else {
clearSearchBtn.classList.remove('visible')
}
executeFilter(true)
})

clearSearchBtn.addEventListener('click', () => {
searchInput.value = ''
searchQuery = ''
clearSearchBtn.classList.remove('visible')
executeFilter(true)
searchInput.focus()
})

resetTagsBtn.addEventListener('click', () => {
activeTags.clear()
document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
executeFilter()
})

sortToggle.addEventListener('click', (e) => {
e.stopPropagation()
sortMenu.classList.toggle('show')
sortToggle.classList.toggle('active')
})

document.addEventListener('click', () => {
sortMenu.classList.remove('show')
sortToggle.classList.remove('active')
})

document.querySelectorAll('.sort-item').forEach(btn => {
btn.addEventListener('click', (e) => {
document.querySelectorAll('.sort-item').forEach(b => b.classList.remove('active'))
e.target.classList.add('active')
const icon = '<img src="assets/icons/sort.svg" alt="Sort" class="icon">'
sortToggle.innerHTML = icon
triggerSort(e.target.dataset.key, parseInt(e.target.dataset.dir))
})
})

window.addEventListener('scroll', () => {
if (window.scrollY > 300) {
backToTopBtn.classList.add('visible')
} else {
backToTopBtn.classList.remove('visible')
}
})

backToTopBtn.addEventListener('click', () => {
window.scrollTo({ top: 0, behavior: 'smooth' })
})

function toggleTagSelection(tagValue, skipAnimation = false) {
const lowerTag = tagValue.toLowerCase()
if (activeTags.has(lowerTag)) {
activeTags.delete(lowerTag)
} else {
activeTags.add(lowerTag)
}

document.querySelectorAll('.filter-btn').forEach(btn => {
if (activeTags.has(btn.dataset.tag.toLowerCase())) {
btn.classList.add('active')
} else {
btn.classList.remove('active')
}
})

executeFilter(skipAnimation)
}

function renderList(skipAnimation = false) {
wrapper.innerHTML = ""
const totalCount = currentProjectsData.length
resultsCount.innerText = `${totalCount} ${totalCount === 1 ? 'result' : 'results'} found`
prevBtn.disabled = true
nextBtn.disabled = true
if (currentProjectsData.length === 0) {
paginationControls.style.display = 'none'
const msg = document.createElement('div')
msg.className = 'no-results-msg'
msg.innerText = "Try a different search."
wrapper.appendChild(msg)
} else {
paginationControls.style.display = ''
pageDisplay.style.display = ''
currentProjectsData.forEach(p => {
const row = document.createElement('div')
row.className = 'project-row'

const tagsHtml = p.rawTags.map(t => {
const isActive = activeTags.has(t.toLowerCase())
return `<span class="project-tag ${isActive ? 'active' : ''}" data-tag="${t.toLowerCase()}">${formatText(t)}</span>`
}).join('')

const imageBlock = p.imgUrl ? `<img src="${p.imgUrl}" class="project-img" alt="${p.title}" onerror="handleImgError(this)">` : `<div class="img-placeholder"><svg viewBox="0 0 160 90" preserveAspectRatio="none"><line x1="0" y1="0" x2="160" y2="90" stroke="#000000" stroke-width="1.5"/><line x1="160" y1="0" x2="0" y2="90" stroke="#000000" stroke-width="1.5"/></svg></div>`

row.innerHTML = `
<div class="col-img-wrapper">
${imageBlock}
</div>
<div class="col-desc">
<div class="col-title">${p.title}</div>
<div class="col-desc-text">${p.desc}</div>
<div class="row-tags-container">${tagsHtml}</div>
</div>
<div class="col-author"><span class="author-by">By </span>${p.author}</div>
<div class="col-date">${p.fullDate}</div>
<div class="col-view">
<span>View</span>
<svg class="view-arrow" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10">
<line x1="2" y1="12" x2="22" y2="12"></line>
<polyline points="15 5 22 12 15 19"></polyline>
</svg>
</div>`

row.querySelector('.col-view').onclick = (e) => {
e.stopPropagation()
window.open(p.url, '_blank')
}

row.querySelectorAll('.project-tag').forEach(tagElement => {
tagElement.onclick = (e) => {
e.stopPropagation()
toggleTagSelection(tagElement.dataset.tag, true)
}
})

wrapper.appendChild(row)
})

currentPageNum.innerText = "1"
totalPagesDisplay.innerText = "/1"
}
if (skipAnimation) {
wrapper.classList.remove('fading')
} else {
setTimeout(() => wrapper.classList.remove('fading'), 50)
}
}

function sortDataArray() {
if (activeTags.size > 0) {
currentProjectsData.forEach(p => {
p.matchCount = p.rawTags.filter(tag => activeTags.has(tag.toLowerCase())).length
})
}

currentProjectsData.sort((a, b) => {
if (activeTags.size > 0) {
if (a.matchCount > b.matchCount) return -1
if (a.matchCount < b.matchCount) return 1
}

if (currentSortDir === 0) {
return a.randomScore - b.randomScore
}

let valA = a[currentSortKey]
let valB = b[currentSortKey]
if (currentSortKey === 'views') {
if (valA < valB) return -1 * currentSortDir
if (valA > valB) return 1 * currentSortDir
return 0
}

if (typeof valA === 'string') { valA = valA.toLowerCase() }
if (typeof valB === 'string') { valB = valB.toLowerCase() }
if (valA < valB) return -1 * currentSortDir
if (valA > valB) return 1 * currentSortDir
return 0
})
}

function executeFilter(skipAnimation = false) {
const applyLogic = () => {
currentProjectsData = allProjectsData.filter(p => {
const matchTag = activeTags.size === 0 || p.rawTags.some(tag => activeTags.has(tag))
const matchSearch = searchQuery === "" ||
p.title.toLowerCase().includes(searchQuery) ||
p.author.toLowerCase().includes(searchQuery) ||
p.tagsInline.toLowerCase().includes(searchQuery) ||
p.desc.toLowerCase().includes(searchQuery)
return matchTag && matchSearch
})
sortDataArray()
renderList(skipAnimation)
}
if (skipAnimation) {
applyLogic()
} else {
wrapper.classList.add('fading')
setTimeout(applyLogic, 300)
}
}

function triggerSort(key, direction) {
currentSortKey = key
currentSortDir = direction
if (key === 'views' && direction === 0) {
allProjectsData.forEach(p => {
p.randomScore = Math.random()
})
}
wrapper.classList.add('fading')
setTimeout(() => {
sortDataArray()
renderList()
}, 300)
}

function formatText(str) {
if (!str) return ""
return str.trim().toLowerCase().replace(/(?:^|[\s\-])\s*[a-z]/g, (match) => match.toUpperCase())
}

async function initIndex() {
try {
const res = await fetch('https://ixd-supsi.github.io/n70api/data.json')
const rawData = await res.json()
const baseUrl = "https://raw.githubusercontent.com/ixd-supsi/n70api/main/immagini/"
let uniqueTags = new Set()

allProjectsData = rawData.map(p => {
const d = p.data || {}
const monthStr = String(d.mese || 1).padStart(2, '0')
const dayStr = String(d.giorno || 1).padStart(2, '0')
const annoNum = d.anno || 2024
const dateObj = new Date(annoNum, (d.mese || 1) - 1, d.giorno || 1)
const fullDate = dateObj.toLocaleDateString(navigator.language, { day: '2-digit', month: '2-digit', year: 'numeric' })
const dateScore = parseInt(`${annoNum}${monthStr}${dayStr}`)

const rawTagsArray = Array.isArray(p.tags) ? p.tags : []
const processedTags = rawTagsArray.map(t => t.trim().toLowerCase()).filter(t => t.length > 0)
processedTags.sort((a, b) => a.localeCompare(b))
processedTags.forEach(t => {
uniqueTags.add(t)
})
const imgObj = p.immagine || {}
let imgFilename = ""
if (typeof imgObj === 'object') {
const key = Object.keys(imgObj).find(k => k.endsWith('_1'))
imgFilename = key ? imgObj[key] : (Object.values(imgObj)[0] || "")
} else {
imgFilename = imgObj
}

const titleStr = p.titolo ? p.titolo.trim() : "Untitled"
const charArray = titleStr.split('')
let charSum = 0
charArray.forEach(c => {
charSum += c.charCodeAt(0)
})
const pseudoViews = (charSum * 37) % 9973

return {
title: titleStr,
desc: p.descrizione || "No description available.",
imgUrl: imgFilename ? baseUrl + imgFilename : "",
url: p.url || "#",
author: formatText(p.autore || "Anonymous"),
fullDate: fullDate,
dateScore: dateScore,
tagsInline: processedTags.length > 0 ? processedTags.map(t => formatText(t)).join(', ') : "Various",
rawTags: processedTags,
views: pseudoViews,
randomScore: Math.random()
}
})
const tagsWithCounts = Array.from(uniqueTags).map(tag => ({ tag, count: allProjectsData.filter(p => p.rawTags.includes(tag)).length }))
tagsWithCounts.sort((a, b) => {
if (b.count !== a.count) {
return b.count - a.count
}
return a.tag.localeCompare(b.tag)
})

tagsContainer.innerHTML = ""

tagsWithCounts.forEach((item) => {
const btn = document.createElement('button')
btn.className = 'action-btn filter-btn'
btn.dataset.tag = item.tag
btn.innerText = `${formatText(item.tag)} (${item.count})`
btn.onclick = (e) => {
toggleTagSelection(item.tag)
}
tagsContainer.appendChild(btn)
})

currentProjectsData = [...allProjectsData]
sortDataArray()
renderList()

const copyrightEl = document.querySelector('.about-col-1')
if (copyrightEl) {
copyrightEl.classList.add('visible')
}

} catch (err) {
console.error("API Fetch Error:", err)
}
}
initIndex()
</script>

</body>
</html>
