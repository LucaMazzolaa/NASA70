<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N70 | Archive Index</title>
    <style>
        :root { --bg: #ffffff }
        :root { --text: #000000 }
        :root { --text-50: #7c7c7c }
        :root { --text-30: #b2b2b2 }
        :root { --ui-font: 'SuisseIntl', sans-serif }
        :root { --ease: cubic-bezier(0.19, 1, 0.22, 1) }

        * { margin: 0 }
        * { padding: 0 }
        * { box-sizing: border-box }
        * { cursor: none !important }

        html { -ms-overflow-style: none }
        html { scrollbar-width: none }
        html { overflow-x: hidden }

        body { -ms-overflow-style: none }
        body { scrollbar-width: none }
        body { overflow-x: hidden }
        body { background-color: var(--bg) }
        body { font-family: var(--ui-font) }
        body { color: var(--text) }
        body { -webkit-font-smoothing: antialiased }
        body { text-rendering: optimizeLegibility }
        body { font-weight: 500 }
        body { font-size: 18px }
        body { line-height: 1.15 }
        body { min-height: 100vh }
        body { display: flex }
        body { flex-direction: column }

        .icon { height: 13px }
        .icon { width: auto }
        .icon { display: block }

        header { position: fixed }
        header { top: 0 }
        header { left: 0 }
        header { width: 100% }
        header { padding: 20px 20px 40px 20px }
        header { display: grid }
        header { grid-template-columns: 1fr auto 1fr }
        header { align-items: flex-start }
        header { z-index: 1000 }
        header { background: var(--bg) }

        .header-left { display: flex }
        .header-left { justify-content: flex-start }
        .header-left { pointer-events: auto }

        .site-title { font-size: 18px }
        .site-title { font-weight: 500 }
        .site-title { color: var(--text) }
        .site-title { letter-spacing: 0.01em }
        .site-title { cursor: pointer }
        
        .logo-container { display: flex }
        .logo-container { justify-content: center }
        .logo-container { pointer-events: auto }

        .logo-container img { height: 45px }
        .logo-container img { width: auto }
        .logo-container img { display: block }
        
        nav { display: flex }
        nav { justify-content: flex-end }
        nav { gap: 20px }
        nav { align-items: flex-start }
        nav { pointer-events: auto }
        
        nav a { text-decoration: none }
        nav a { color: var(--text-30) }
        nav a { font-size: 18px }
        nav a { font-weight: 500 }
        nav a { letter-spacing: 0.01em }
        nav a { transition: color 0.3s var(--ease) }
        nav a { cursor: none }
        nav a { line-height: 1 }
        
        nav a:hover { color: var(--text) }
        nav a.active { color: var(--text) }

        #controls-section { position: fixed }
        #controls-section { top: 100px }
        #controls-section { left: 0 }
        #controls-section { width: 100% }
        #controls-section { padding: 40px 20px 25px 20px }
        #controls-section { margin-bottom: 0 }
        #controls-section { display: grid }
        #controls-section { grid-template-columns: 1fr auto 1fr }
        #controls-section { align-items: baseline }
        #controls-section { background-color: var(--bg) }
        #controls-section { z-index: 990 }

        .right-controls { display: flex }
        .right-controls { justify-content: flex-end }
        .right-controls { align-items: center }
        .right-controls { gap: 30px }
        
        .search-container { display: flex }
        .search-container { align-items: center }
        .search-container { gap: 8px }
        .search-container { border-bottom: 1px solid var(--text) }
        .search-container { width: 220px }
        .search-container { padding-bottom: 4px }

        .search-input { background: transparent }
        .search-input { border: none }
        .search-input { font-family: var(--ui-font) }
        .search-input { font-size: 18px }
        .search-input { font-weight: 500 }
        .search-input { color: var(--text) }
        .search-input { outline: none }
        .search-input { padding: 0 }
        .search-input { width: 100% }
        .search-input { transition: color 0.3s var(--ease) }
        
        .search-input::placeholder { color: var(--text) }
        .search-input::placeholder { transition: color 0.3s var(--ease) }
        .search-input::placeholder { opacity: 1 }
        
        .search-input:focus::placeholder { color: var(--text-30) }

        .sort-wrapper { display: flex }
        .sort-wrapper { flex-direction: row }
        .sort-wrapper { align-items: baseline }
        
        .sort-dropdown-container { display: flex }
        .sort-dropdown-container { align-items: baseline }
        .sort-dropdown-container { position: relative }

        .buttons-container { display: flex }
        .buttons-container { flex-direction: column }
        .buttons-container { gap: 12px }
        .buttons-container { width: auto }

        .tag-row { display: flex }
        .tag-row { flex-wrap: nowrap }
        .tag-row { white-space: nowrap }
        .tag-row { gap: 15px }

        .action-btn { background: transparent }
        .action-btn { border: none }
        .action-btn { font-family: var(--ui-font) }
        .action-btn { font-size: 18px }
        .action-btn { font-weight: 500 }
        .action-btn { color: var(--text-30) }
        .action-btn { transition: color 0.3s var(--ease) }
        .action-btn { letter-spacing: 0.01em }
        .action-btn { position: relative }
        .action-btn { cursor: none }
        .action-btn { padding: 0 }
        .action-btn { display: flex }
        .action-btn { align-items: center }
        .action-btn { gap: 8px }

        .action-btn:hover { color: var(--text) }
        .action-btn.active { color: var(--text) }

        .custom-dropdown { position: relative }
        .dropdown-toggle { color: var(--text) }

        .dropdown-menu { position: absolute }
        .dropdown-menu { top: 100% }
        .dropdown-menu { right: 0 }
        .dropdown-menu { padding-top: 10px }
        .dropdown-menu { display: flex }
        .dropdown-menu { flex-direction: column }
        .dropdown-menu { align-items: flex-end }
        .dropdown-menu { gap: 10px }
        .dropdown-menu { opacity: 0 }
        .dropdown-menu { pointer-events: none }
        .dropdown-menu { transform: translateY(-5px) }
        .dropdown-menu { transition: opacity 0.3s var(--ease), transform 0.3s var(--ease) }
        .dropdown-menu { z-index: 100 }
        .dropdown-menu { background: var(--bg) }
        .dropdown-menu { padding-bottom: 0 }

        .dropdown-menu.show { opacity: 1 }
        .dropdown-menu.show { pointer-events: auto }
        .dropdown-menu.show { transform: translateY(0) }

        .dropdown-item { background: transparent }
        .dropdown-item { border: none }
        .dropdown-item { font-family: var(--ui-font) }
        .dropdown-item { font-size: 18px }
        .dropdown-item { font-weight: 500 }
        .dropdown-item { color: var(--text-30) }
        .dropdown-item { transition: color 0.3s var(--ease) }
        .dropdown-item { letter-spacing: 0.01em }
        .dropdown-item { white-space: nowrap }
        .dropdown-item { cursor: none }
        
        .dropdown-item:hover { color: var(--text) }
        .dropdown-item.active { color: var(--text) }

        #pagination-controls { padding: 40px 20px 20px 20px }
        #pagination-controls { display: flex }
        #pagination-controls { align-items: center }
        #pagination-controls { gap: 20px }
        #pagination-controls { font-size: 18px }
        #pagination-controls { color: var(--text) }
        #pagination-controls { margin-top: auto }
        
        #pagination-controls .nav-btn { color: var(--text) }
        #pagination-controls .nav-btn { cursor: none !important }
        
        #pagination-controls .nav-btn:disabled { color: var(--text-30) }
        #pagination-controls .nav-btn:disabled { cursor: none !important }
        
        #current-page-num { color: var(--text) }
        #total-pages-display { color: var(--text-30) }

        #cursor { position: fixed }
        #cursor { top: 0 }
        #cursor { left: 0 }
        #cursor { pointer-events: none }
        #cursor { z-index: 99999 }
        #cursor { transform: translate(0,0) }
        #cursor { mix-blend-mode: difference }
        #cursor { color: #ffffff }
        
        .cursor-dot { width: 14px }
        .cursor-dot { height: 14px }
        .cursor-dot { background-color: #ffffff }
        .cursor-dot { border-radius: 50% }
        .cursor-dot { position: absolute }
        .cursor-dot { top: 0 }
        .cursor-dot { left: 0 }
        .cursor-dot { transform: translate(-50%, -50%) }
        .cursor-dot { transition: width 0.25s var(--ease), height 0.25s var(--ease), opacity 0.3s var(--ease) }

        #cursor.expand .cursor-dot { width: 35px }
        #cursor.expand .cursor-dot { height: 35px }
        
        #cursor.project-hover .cursor-dot { opacity: 0 }

        .cursor-label { position: absolute }
        .cursor-label { top: 0 }
        .cursor-label { left: 0 }
        .cursor-label { transform: translate(-50%, -50%) scale(0.8) }
        .cursor-label { display: flex }
        .cursor-label { align-items: center }
        .cursor-label { gap: 10px }
        .cursor-label { opacity: 0 }
        .cursor-label { transition: opacity 0.3s var(--ease), transform 0.3s var(--ease) }
        .cursor-label { white-space: nowrap }
        .cursor-label { font-family: var(--ui-font) }
        .cursor-label { font-size: 20px }

        #cursor.project-hover .cursor-label { opacity: 1 }
        #cursor.project-hover .cursor-label { transform: translate(-50%, -50%) scale(1) }

        .cursor-label svg { width: 26px }
        .cursor-label svg { height: 24px }
        .cursor-label svg { transition: transform 0.3s var(--ease) }
        
        #cursor.project-hover .cursor-label svg { transform: translateX(5px) }

        #index-wrapper { padding: 230px 20px 20px 20px }
        #index-wrapper { max-width: 100% }
        #index-wrapper { transition: opacity 0.3s ease }
        #index-wrapper { flex-grow: 1 }
        
        #index-wrapper.fading { opacity: 0 }

        .project-row { border: none }
        .project-row { width: 100% }
        .project-row { color: var(--text) }
        .project-row { transition: color 0.3s var(--ease) }
        .project-row { cursor: pointer }
        
        .project-row:hover { color: var(--text) }

        .row-main { display: grid }
        .row-main { grid-template-columns: 1.5fr 2fr 4.5fr 1fr }
        .row-main { padding: 5px 0 }
        .row-main { font-size: 18px }
        .row-main { font-weight: 500 }
        .row-main { align-items: baseline }
        
        .col-author { color: inherit }
        .col-author { padding-left: 20px }
        
        .col-cat { color: inherit }
        
        .col-date { text-align: right }

        .row-details { display: grid }
        .row-details { grid-template-columns: 1fr 2.5fr 4.5fr 1fr }
        .row-details { opacity: 1 }
        .row-details { padding-bottom: 30px }

        .inner-left { grid-column: 1 / 3 }
        .inner-left { padding-right: 20px }
        
        .project-img { width: 100% }
        .project-img { aspect-ratio: 16 / 9 }
        .project-img { display: block }
        .project-img { background-color: #e0e0e0 }
        .project-img { object-fit: cover }
        
        .inner-right { grid-column: 3 / 4 }
        .inner-right { padding-right: 15px }
        
        .project-desc { font-size: 18px }
        .project-desc { font-weight: 500 }
        .project-desc { line-height: 1.15 }
    </style>
</head>
<body>

<div id="cursor">
    <div class="cursor-dot"></div>
    <div class="cursor-label">
        <span id="cursor-text">Project Title</span>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 12H20M20 12L13 5M20 12L13 19" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"></path>
        </svg>
    </div>
</div>

<header>
    <div class="header-left">
        <span class="site-title hover-target" onclick="window.location.href='index.html'">NASA70</span>
    </div>
    <div class="logo-container">
        <img src="assets/logo.svg" alt="N70 Logo" class="hover-target" onclick="window.open('https://www.nasa.gov/', '_blank')">
    </div>
    <nav>
        <a href="index.html" class="hover-target">Explore</a>
        <a href="projects.html" class="hover-target active">Projects</a>
        <a href="about.html" class="hover-target">About</a>
    </nav>
</header>

<section id="controls-section">
    <div class="buttons-container fade-in-1" id="tags-container">
    </div>
    
    <div></div>
    
    <div class="right-controls fade-in-1">
        <div class="sort-wrapper">
            <div class="sort-dropdown-container">
                <div class="custom-dropdown">
                    <button class="action-btn dropdown-toggle hover-target" id="sort-toggle">
                        <img src="assets/sort.svg" alt="Sort" class="icon">
                        Sort
                    </button>
                    <div class="dropdown-menu" id="sort-menu">
                        <button class="dropdown-item sort-item hover-target active" data-key="title" data-dir="1">Title (A-Z)</button>
                        <button class="dropdown-item sort-item hover-target" data-key="title" data-dir="-1">Title (Z-A)</button>
                        <button class="dropdown-item sort-item hover-target" data-key="author" data-dir="1">Author (A-Z)</button>
                        <button class="dropdown-item sort-item hover-target" data-key="author" data-dir="-1">Author (Z-A)</button>
                        <button class="dropdown-item sort-item hover-target" data-key="dateScore" data-dir="1">Date (Ascending)</button>
                        <button class="dropdown-item sort-item hover-target" data-key="dateScore" data-dir="-1">Date (Descending)</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="search-container">
            <img src="assets/search.svg" alt="Search" class="icon">
            <input type="text" id="search-input" class="search-input hover-target" placeholder="Search" autocomplete="off" spellcheck="false">
        </div>
    </div>
</section>

<main id="index-wrapper" class="fade-in-2"></main>

<div id="pagination-controls" class="fade-in-2">
    <button class="action-btn nav-btn hover-target" id="prev-btn">Previous</button>
    <span id="page-display"><span id="current-page-num">1</span><span id="total-pages-display"> / 1</span></span>
    <button class="action-btn nav-btn hover-target" id="next-btn">Next</button>
</div>

<script>
    const wrapper = document.getElementById('index-wrapper')
    const cursor = document.getElementById('cursor')
    const cursorText = document.getElementById('cursor-text')
    const tagsContainer = document.getElementById('tags-container')
    const searchInput = document.getElementById('search-input')
    const sortToggle = document.getElementById('sort-toggle')
    const sortMenu = document.getElementById('sort-menu')
    
    const prevBtn = document.getElementById('prev-btn')
    const nextBtn = document.getElementById('next-btn')
    const currentPageNum = document.getElementById('current-page-num')
    const totalPagesDisplay = document.getElementById('total-pages-display')
    
    let allProjectsData = []
    let currentProjectsData = []
    let currentSortKey = 'dateScore'
    let currentSortDir = 1
    let activeTags = new Set()
    let searchQuery = ""
    
    let currentPage = 1
    const itemsPerPage = 10

    window.addEventListener('mousemove', (e) => {
        cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`
    })

    function attachCursorEvents() {
        document.querySelectorAll('.hover-target:not(.project-row)').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('expand'))
            el.addEventListener('mouseleave', () => cursor.classList.remove('expand'))
        })
    }

    searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim()
        currentPage = 1
        executeFilter(true)
    })

    sortToggle.addEventListener('click', (e) => {
        e.stopPropagation()
        sortMenu.classList.toggle('show')
    })

    document.addEventListener('click', () => { 
        sortMenu.classList.remove('show') 
    })

    document.querySelectorAll('.sort-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.sort-item').forEach(b => b.classList.remove('active'))
            e.target.classList.add('active')
            
            const icon = '<img src="assets/sort.svg" alt="Sort" class="icon">'
            sortToggle.innerHTML = icon + "Sort"
            
            currentPage = 1
            triggerSort(e.target.dataset.key, parseInt(e.target.dataset.dir))
        })
    })

    prevBtn.onclick = () => { 
        if(currentPage > 1) { 
            currentPage -= 1 
            renderList() 
            window.scrollTo(0, 0) 
        } 
    }
    
    nextBtn.onclick = () => { 
        if(currentPage < Math.ceil(currentProjectsData.length / itemsPerPage)) { 
            currentPage += 1 
            renderList() 
            window.scrollTo(0, 0) 
        } 
    }

    function renderList(skipAnimation = false) {
        wrapper.innerHTML = ""
        
        if (currentProjectsData.length === 0) {
            prevBtn.style.display = 'none'
            nextBtn.style.display = 'none'
            currentPageNum.innerText = "No matching projects found."
            totalPagesDisplay.innerText = ""
        } else {
            prevBtn.style.display = ''
            nextBtn.style.display = ''
            const totalPages = Math.ceil(currentProjectsData.length / itemsPerPage)
            const start = (currentPage - 1) * itemsPerPage
            const end = start + itemsPerPage
            const pageItems = currentProjectsData.slice(start, end)
            
            pageItems.forEach(p => {
                const row = document.createElement('div')
                row.className = 'project-row'
                row.onclick = () => window.open(p.url, '_blank')
                
                row.addEventListener('mouseenter', () => {
                    cursorText.innerText = p.title
                    cursor.classList.add('project-hover')
                })
                row.addEventListener('mouseleave', () => {
                    cursor.classList.remove('project-hover')
                })

                row.innerHTML = `
                    <div class="row-main hover-target">
                        <div class="col-name">${p.title}</div>
                        <div class="col-author">By ${p.author}</div>
                        <div class="col-cat">${p.tagsInline}</div>
                        <div class="col-date">${p.fullDate}</div>
                    </div>
                    <div class="row-details">
                        <div class="inner-left">
                            <img src="${p.imgUrl}" class="project-img" alt="${p.title}" onerror="this.style.display='none'">
                        </div>
                        <div class="inner-right"><div class="project-desc">${p.desc}</div></div>
                    </div>`
                wrapper.appendChild(row)
            })

            currentPageNum.innerText = `${currentPage}`
            totalPagesDisplay.innerText = ` / ${totalPages}`
            prevBtn.disabled = currentPage === 1
            nextBtn.disabled = currentPage === totalPages
            
            attachCursorEvents()
        }
        
        if (skipAnimation) { 
            wrapper.classList.remove('fading') 
        } else { 
            setTimeout(() => wrapper.classList.remove('fading'), 50) 
        }
    }

    function sortDataArray() {
        currentProjectsData.sort((a, b) => {
            let valA = a[currentSortKey]
            let valB = b[currentSortKey]
            if (typeof valA === 'string') { valA = valA.toLowerCase() }
            if (typeof valB === 'string') { valB = valB.toLowerCase() }
            if (valA < valB) return -1 * currentSortDir
            if (valA > valB) return 1 * currentSortDir
            return 0
        })
    }

    function executeFilter(skipAnimation = false) {
        const applyLogic = () => {
            currentProjectsData = allProjectsData.filter(p => {
                const matchTag = activeTags.size === 0 || p.rawTags.some(tag => activeTags.has(tag))
                const matchSearch = searchQuery === "" || 
                                    p.title.toLowerCase().includes(searchQuery) || 
                                    p.author.toLowerCase().includes(searchQuery) || 
                                    p.tagsInline.toLowerCase().includes(searchQuery) ||
                                    p.desc.toLowerCase().includes(searchQuery)
                return matchTag && matchSearch
            })
            sortDataArray()
            renderList(skipAnimation)
        }
        
        if (skipAnimation) { 
            applyLogic() 
        } else { 
            wrapper.classList.add('fading')
            setTimeout(applyLogic, 300) 
        }
    }

    function triggerSort(key, direction) {
        currentSortKey = key
        currentSortDir = direction
        wrapper.classList.add('fading')
        setTimeout(() => { 
            sortDataArray()
            renderList() 
        }, 300)
    }

    function formatText(str) {
        if (!str) return ""
        return str.trim().split(/\s+/).map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' ')
    }

    async function initIndex() {
        try {
            const res = await fetch('https://ixd-supsi.github.io/n70api/data.json')
            const rawData = await res.json()
            const baseUrl = "https://raw.githubusercontent.com/ixd-supsi/n70api/main/immagini/"
            let uniqueTags = new Set()
            const ALLOWED_TAGS = new Set(["2d", "3d", "apollo", "astronomy", "audio", "climate", "science", "data visualization", "earth", "planets", "educational", "game", "history", "archive", "robot", "space"])

            allProjectsData = rawData.map(p => {
                const d = p.data || {}
                const fullDate = `${d.giorno || '01'}/${d.mese || '01'}/${d.anno || '2024'}`
                const dateScore = parseInt(`${d.anno || 2024}${String(d.mese || 1).padStart(2,'0')}${String(d.giorno || 1).padStart(2,'0')}`)
                const rawTagsArray = Array.isArray(p.tags) ? p.tags : []
                const tagsArray = rawTagsArray.filter(t => ALLOWED_TAGS.has(t.toLowerCase()))
                tagsArray.forEach(t => uniqueTags.add(t.toLowerCase()))
                
                const imgObj = p.immagine || {}
                let imgFilename = ""
                if (typeof imgObj === 'object') {
                    const key = Object.keys(imgObj).find(k => k.endsWith('_1'))
                    imgFilename = key ? imgObj[key] : (Object.values(imgObj)[0] || "")
                } else {
                    imgFilename = imgObj
                }

                return {
                    title: p.titolo ? p.titolo.trim() : "Untitled",
                    desc: p.descrizione || "No description available.",
                    imgUrl: imgFilename ? baseUrl + imgFilename : "",
                    url: p.url || "#",
                    author: formatText(p.autore || "Anonymous"), 
                    fullDate: fullDate, 
                    dateScore: dateScore, 
                    tagsInline: tagsArray.length > 0 ? tagsArray.map(t => formatText(t)).join(', ') : "Various",
                    rawTags: tagsArray.map(t => t.toLowerCase())
                }
            })
            
            const tagsWithCounts = Array.from(uniqueTags).map(tag => ({ tag, count: allProjectsData.filter(p => p.rawTags.includes(tag)).length }))
            tagsWithCounts.sort((a, b) => b.count - a.count)

            tagsContainer.innerHTML = ""
            
            const row1 = document.createElement('div')
            row1.className = 'tag-row'
            const row2 = document.createElement('div')
            row2.className = 'tag-row'
            
            tagsContainer.appendChild(row1)
            tagsContainer.appendChild(row2)

            const btnAll = document.createElement('button')
            btnAll.className = 'action-btn filter-btn hover-target active'
            btnAll.dataset.tag = 'all'
            btnAll.innerText = `All (${allProjectsData.length})`
            
            btnAll.onclick = () => {
                activeTags.clear()
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
                btnAll.classList.add('active')
                currentPage = 1
                executeFilter()
            }
            
            row1.appendChild(btnAll)

            tagsWithCounts.forEach((item, i) => {
                const btn = document.createElement('button')
                btn.className = 'action-btn filter-btn hover-target'
                btn.dataset.tag = item.tag
                btn.innerText = `${formatText(item.tag)} (${item.count})`
                
                btn.onclick = (e) => {
                    if (activeTags.has(item.tag)) { 
                        activeTags.delete(item.tag)
                        e.target.classList.remove('active') 
                    } else { 
                        activeTags.add(item.tag)
                        e.target.classList.add('active') 
                    }
                    if (activeTags.size === 0) {
                        btnAll.classList.add('active')
                    } else {
                        btnAll.classList.remove('active')
                    }
                    currentPage = 1
                    executeFilter()
                }
                
                if (i < 7) {
                    row1.appendChild(btn)
                } else {
                    row2.appendChild(btn)
                }
            })

            currentProjectsData = [...allProjectsData]
            sortDataArray()
            renderList()
